<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Lapse</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a8176;--ac:#e0653a;--ln:#e8e1d6;--lv:#f3d9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#27241f;--tx:#f1ece4;--mu:#a39a8d;--ln:#3a352d;--lv:#4a3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#27241f;--tx:#f1ece4;--mu:#a39a8d;--ln:#3a352d;--lv:#4a3328;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=text]{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
video{width:100%;border-radius:10px;background:#000;margin-top:10px;max-height:300px;object-fit:cover}
#tm{font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.row{display:flex;gap:8px}
.btn{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#fff}
.btn.g{background:var(--ln);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpi b{display:block;font-size:22px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.heat span{aspect-ratio:1;border-radius:6px;background:var(--ln)}
.day{font-weight:600;margin:16px 0 8px}
.pics{display:flex;flex-wrap:wrap;gap:12px}
.pol{width:calc(50% - 6px);background:#fff;color:#2b2620;padding:6px 6px 8px;border-radius:4px;box-shadow:0 2px 8px #0003;transform:rotate(-2deg)}
.pol:nth-child(even){transform:rotate(2deg)}
.pol img{width:100%;display:block;background:#ddd;aspect-ratio:4/3;object-fit:cover}
.pol .ph{aspect-ratio:4/3;background:#eee;display:flex;align-items:center;justify-content:center;font-size:30px}
.pol p{margin:6px 0 4px;font-size:13px}
.pol button{border:0;background:none;font-size:15px;padding:4px 8px}
dialog{border:0;border-radius:14px;padding:12px;width:min(92vw,520px);background:var(--card);color:var(--tx)}
dialog img{width:100%;border-radius:8px;display:block}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:12px}.cg span{border-radius:6px;padding:4px 0;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;background:var(--bg)}.cg small{font-size:9px}.cg .h{background:none;color:var(--mu);min-height:0}.cg .e{background:none}.cg .t{outline:2px solid var(--tx)}
nav button{font-size:14px;padding:10px 4px}
.lb{position:relative;overflow:hidden;text-align:center;display:block}.lb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.ths{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px}.ths div{position:relative;flex:0 0 64px}.ths img{width:64px;height:48px;object-fit:cover;border-radius:6px;display:block}.ths b{position:absolute;top:-5px;right:-5px;background:#000b;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;text-align:center;line-height:22px}
textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;margin-top:6px;resize:vertical}
.pol button{padding:8px 14px;font-size:17px;min-height:40px;white-space:normal}
.ths div{flex:0 0 72px}.ths img{width:72px;height:54px}.ths b{top:3px;right:3px;width:28px;height:28px;line-height:28px;font-size:15px}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
<h1>📚 Reading Lapse</h1>
<nav><button data-t="rec" class="on">บันทึก</button><button data-t="stat">สถิติ</button><button data-t="cal">ปฏิทิน</button><button data-t="wall">ผนังไทม์แลปส์</button></nav>

<section id="rec">
<div class="card">
<input type="text" id="book" placeholder="กำลังอ่านเล่มไหน? (ไม่ใส่ก็ได้)">
<video id="v" autoplay muted playsinline></video>
<div class="mu" id="msg" style="margin-top:6px">กดเริ่ม แล้ววางมือถือให้เห็นหนังสือ แอพจะจับภาพทุก 5 วินาที</div>
<div id="tm">00:00:00</div>
<div class="row" style="margin-bottom:8px"><label class="btn g lb">📷 ถ่ายรูป<input type="file" id="pf2" accept="image/*" capture="environment"></label><label class="btn g lb">🎬 อัดคลิป<input type="file" id="vf" accept="video/*" capture="environment"></label></div><div class="row" style="margin-bottom:8px"><label class="btn g lb" style="font-size:14px">🖼 เลือกรูป/คลิปจากเครื่อง<input type="file" id="gf" accept="image/*,video/*" multiple></label></div><div class="mu" id="pn"></div><div id="th" class="ths"></div><button class="btn hide" id="sv" style="margin-bottom:10px">💾 บันทึกรูปเลย</button>
<div style="margin:6px 0 10px"><b>📝 โน้ตวันนี้</b><textarea id="tn" rows="3" placeholder="วันนี้อ่านอะไร รู้สึกยังไง..."></textarea></div>
<div class="row hide" style="margin-bottom:10px"><button class="btn g" id="ph">📷 ถ่ายรูป</button><span class="mu" id="pc" style="align-self:center"></span></div><input type="file" id="pf" accept="image/*" capture="environment" class="hide">
<div class="row">
<button class="btn" id="go">▶ เริ่มอ่าน</button>
<button class="btn g hide" id="pz">⏸ พัก</button>
<button class="btn g hide" id="st">⏹ จบ</button>
</div>
</div>
</section>

<section id="stat" class="hide"></section>
<section id="cal" class="hide"></section>
<section id="wall" class="hide"></section>
</div>

<dialog id="cf"><b id="cft" style="font-size:18px"></b><div class="row" style="margin-top:14px"><button class="btn g" id="cfn">ยกเลิก</button><button class="btn" id="cfy" style="background:#d33">🗑 ลบ</button></div></dialog>
<dialog id="cf"><p id="cft" style="margin:4px 0 14px;font-size:17px"></p><div class="row"><button class="btn g" id="cfn">ยกเลิก</button><button class="btn" id="cfy" style="background:#d33">🗑 ลบ</button></div></dialog>
<dialog id="vw"><img id="vi" alt=""><input type="range" id="vs" min="0" value="0" style="width:100%;margin-top:8px"><div class="mu" id="vt" style="text-align:center"></div><div class="row" style="margin-top:8px"><button class="btn g" id="vp">⏸</button><button class="btn" id="vsv">💾 บันทึก</button></div><div class="row" style="margin-top:8px"><button class="btn g" id="vd">🗑 ลบทั้งหมด</button><button class="btn g" id="vdf">ลบเฉพาะภาพนี้</button></div><div class="row" style="margin-top:8px"><button class="btn g" id="vc">ปิด</button></div></dialog>
<dialog id="nd"><b id="ndt"></b><textarea id="ndx" rows="6" placeholder="เขียนโน้ตของวันนี้..."></textarea><div class="row" style="margin-top:8px"><button class="btn" id="ndok">บันทึก</button><button class="btn g" id="ndc">ปิด</button></div></dialog>
<dialog id="dlg"><img id="pimg" alt=""><input type="range" id="sl" min="0" value="0" style="width:100%;margin-top:8px"><div class="row" style="margin-top:8px"><button class="btn g" id="rp">▶ เล่นใหม่</button><button class="btn g" id="dp">🗑 ลบภาพนี้</button><button class="btn g" id="cl">ปิด</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
let db,mem=[];
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('rl',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function all(){return new Promise(r=>{if(!db)return r(mem);try{const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem)}catch(e){r(mem)}})}
function put(o){mem=mem.filter(x=>x.id!==o.id);mem.push(o);if(db)try{db.transaction('s','readwrite').objectStore('s').put(o)}catch(e){}}
function del(id){mem=mem.filter(x=>x.id!==id);if(db)try{db.transaction('s','readwrite').objectStore('s').delete(id)}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const fmt=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(Math.floor(s%60));
const mins=s=>s>=3600?(s/3600).toFixed(1)+' ชม.':Math.round(s/60)+' นาที';
const key=d=>new Date(d).toLocaleDateString('sv');

let stream,tick,frames=[],acc=0,t0=0,running=false,active=false,lastCap=0;
const v=$('#v');
const el=()=>acc+(running?(Date.now()-t0)/1000:0);

function cap(){
  if(!stream||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=320;c.height=Math.round(320*v.videoHeight/v.videoWidth);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  frames.push(c.toDataURL('image/jpeg',.6));
}
function loop(){
  $('#tm').textContent=fmt(el());pc();
  if(running&&el()-lastCap>=5){lastCap=el();cap()}
}
$('#go').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640}}});
    v.srcObject=stream;v.classList.remove('hide');$('#msg').textContent='กำลังบันทึกไทม์แลปส์…';
  }catch(e){stream=null;v.classList.add('hide');$('#msg').textContent='กล้องสดใช้ไม่ได้ในหน้านี้ — กด 📷 ถ่ายรูปเก็บเองได้เลย และจับเวลาต่อไปปกติ'}
  acc=0;t0=Date.now();running=true;active=true;lastCap=0;$('#sv').classList.add('hide');
  setTimeout(cap,800);
  tick=setInterval(loop,500);
  $('#go').classList.add('hide');$('#pz').classList.remove('hide');$('#st').classList.remove('hide');
};
$('#pz').onclick=()=>{
  if(running){acc=el();running=false;$('#pz').textContent='▶ อ่านต่อ'}
  else{t0=Date.now();running=true;$('#pz').textContent='⏸ พัก'}
};
$('#st').onclick=()=>{
  const d=Math.round(el());clearInterval(tick);
  if(stream){stream.getTracks().forEach(t=>t.stop());v.srcObject=null}
  const ok=d>=5||frames.length;if(ok)put({id:Date.now(),book:$('#book').value.trim(),dur:d,frames});
  running=false;active=false;acc=0;frames=[];pc();$('#tm').textContent='00:00:00';
  $('#go').classList.remove('hide');$('#pz').classList.add('hide');$('#st').classList.add('hide');$('#pz').textContent='⏸ พัก';
  $('#msg').textContent=ok?'บันทึกแล้ว! ดูที่แท็บสถิติ 🎉':'สั้นเกินไป ไม่บันทึก';
};

function pc(){$('#pc').textContent=frames.length?'📷 '+frames.length+' ภาพ':''}
$('#ph').onclick=()=>$('#pf').click();
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*im.height/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);frames.push(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(im.src);pc()};im.src=URL.createObjectURL(f);e.target.value=''};
let notes={};try{notes=JSON.parse(localStorage.getItem('rl_n')||'{}')}catch(e){}
function setNote(k,t){if(t.trim())notes[k]=t;else delete notes[k];try{localStorage.setItem('rl_n',JSON.stringify(notes))}catch(e){}}
$('#tn').value=notes[key(Date.now())]||'';$('#tn').oninput=e=>setNote(key(Date.now()),e.target.value);
let nk;function openNote(k){nk=k;$('#ndt').textContent=new Date(k+'T12:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#ndx').value=notes[k]||'';$('#nd').showModal()}
$('#ndok').onclick=()=>{setNote(nk,$('#ndx').value);$('#nd').close();if(!$('#cal').classList.contains('hide'))renderCal();$('#tn').value=notes[key(Date.now())]||''};
$('#ndc').onclick=()=>$('#nd').close();
let cfa;function confirmDel(msg,fn){cfa=fn;$('#cft').textContent=msg;$('#cf').showModal()}
$('#cfy').onclick=()=>{$('#cf').close();const f=cfa;cfa=null;if(f)f()};
$('#cfn').onclick=()=>{cfa=null;$('#cf').close()};
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-d],#da,#dp');if(!t)return;
  if(t.dataset.d){const id=+t.dataset.d;confirmDel('ลบคลิปนี้ใช่ไหม?',()=>{del(id);renderWall()})}
  else if(t.id==='da')confirmDel('ลบประวัติทั้งหมดใช่ไหม? กู้คืนไม่ได้',async()=>{const ss=await all();ss.forEach(s=>del(s.id));renderWall()});
  else if(t.id==='dp')confirmDel('ลบภาพนี้ใช่ไหม?',()=>{clearInterval(pt);const i=+$('#sl').value;cur.frames.splice(i,1);if(!cur.frames.length){del(cur.id);$('#dlg').close();renderWall();return}put(cur);const j=Math.min(i,cur.frames.length-1);$('#sl').max=cur.frames.length-1;$('#sl').value=j;$('#pimg').src=cur.frames[j]});
});
function ask(b){return false;if(!b)return true;if(b.dataset.ok)return true;const t=b.textContent;b.dataset.ok=1;b.textContent='แน่ใจ? กดอีกครั้ง';setTimeout(()=>{delete b.dataset.ok;b.textContent=t},3000);return false}
function pc(){const n=frames.length;if(pc.n===n)return;pc.n=n;$('#pn').textContent=n?'📷 '+n+' ภาพ (กด ✕ เพื่อลบ)':'';const s=Math.max(0,n-15);$('#th').innerHTML=frames.slice(s).map((x,i)=>`<div><img src="${x}" alt=""><b data-r="${s+i}">✕</b></div>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{frames.splice(+b.dataset.r,1);pc()});$('#sv').classList.toggle('hide',active||!n)}
function toF(im,w){const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*(im.videoHeight||im.height)/(im.videoWidth||im.width));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.65)}
function fromVideo(f){return new Promise(r=>{const u=URL.createObjectURL(f),vd=document.createElement('video');vd.muted=true;vd.playsInline=true;vd.preload='auto';vd.src=u;vd.onerror=()=>r();vd.onloadedmetadata=async()=>{const d=isFinite(vd.duration)?vd.duration:10,n=Math.min(60,Math.max(2,Math.round(d/2)));for(let i=0;i<n;i++){await new Promise(ok=>{vd.onseeked=ok;setTimeout(ok,1500);vd.currentTime=Math.min(d-.05,d*i/n)});if(vd.videoWidth)frames.push(toF(vd,320));pc()}URL.revokeObjectURL(u);r()}})}
function fromImg(f){return new Promise(r=>{const im=new Image();im.onload=()=>{frames.push(toF(im,480));URL.revokeObjectURL(im.src);pc();r()};im.onerror=()=>r();im.src=URL.createObjectURL(f)})}
['pf2','vf','gf'].forEach(id=>$('#'+id).onchange=async e=>{const fl=[...e.target.files];e.target.value='';for(const f of fl){if(f.type.startsWith('video'))await fromVideo(f);else await fromImg(f)}});
$('#sv').onclick=()=>{put({id:Date.now(),book:$('#book').value.trim(),dur:0,frames});frames=[];pc();$('#msg').textContent='บันทึกแล้ว ดูที่แท็บผนังไทม์แลปส์'};
async function renderStats(){
  const ss=await all();const by={};
  ss.forEach(s=>{const k=key(s.id);by[k]=(by[k]||0)+s.dur});
  const today=key(Date.now());
  const days=[...Array(28)].map((_,i)=>key(Date.now()-(27-i)*864e5));
  const wk=days.slice(21).reduce((a,k)=>a+(by[k]||0),0);
  let st=0,i=27;if(!by[days[27]])i=26;
  while(i>=0&&by[days[i]]){st++;i--}
  const w7=days.slice(21),mx=Math.max(1,...w7.map(k=>by[k]||0));
  const nm=['อา','จ','อ','พ','พฤ','ศ','ส'];
  $('#stat').innerHTML=`
  <div class="card kpi"><div><b>${mins(by[today]||0)}</b><span class="mu">วันนี้</span></div><div><b>${mins(wk)}</b><span class="mu">7 วันล่าสุด</span></div><div><b>${st} 🔥</b><span class="mu">วันติดต่อกัน</span></div></div>
  <div class="card"><b>7 วันล่าสุด</b><div class="bars">${w7.map(k=>`<div><span>${by[k]?Math.round(by[k]/60):''}</span><i style="height:${(by[k]||0)/mx*80}px"></i>${nm[new Date(k+'T12:00').getDay()]}</div>`).join('')}</div></div>
  <div class="card"><b>28 วันล่าสุด</b><div class="heat">${days.map(k=>{const m=(by[k]||0)/60;const o=m?Math.min(1,.25+m/90):0;return `<span title="${k}: ${Math.round(m)} นาที" style="${o?`background:var(--ac);opacity:${o}`:''}"></span>`}).join('')}</div><div class="mu" style="margin-top:6px">ยิ่งเข้ม ยิ่งอ่านนาน</div></div>
  <div class="card mu">รวมทั้งหมด ${ss.length} ครั้ง • ${mins(ss.reduce((a,s)=>a+s.dur,0))}</div>`;
}
async function renderWall(){
  const ss=(await all()).sort((a,b)=>b.id-a.id);
  if(!ss.length){$('#wall').innerHTML='<div class="card mu">ยังไม่มีคลิป ไปอัดครั้งแรกกันเลย</div>';return}
  const g={};ss.forEach(s=>(g[key(s.id)]=g[key(s.id)]||[]).push(s));
  $('#wall').innerHTML=Object.keys(g).map(k=>`<div class="day">${new Date(k+'T12:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})} • ${mins(g[k].reduce((a,s)=>a+s.dur,0))}</div><div class="pics">${g[k].map(s=>`<div class="pol">${s.frames.length?`<img src="${s.frames[Math.floor(s.frames.length/2)]}" alt="">`:'<div class="ph">📖</div>'}<p>${(s.book||'ไม่ระบุเล่ม').replace(/</g,'&lt;')} • ${mins(s.dur)}</p><button data-p="${s.id}">▶</button><button data-d="${s.id}">🗑</button></div>`).join('')}</div>`).join('');
  Object.keys(g).forEach((k,i)=>{const d=document.querySelectorAll('#wall .day')[i];const t=document.createElement('textarea');t.rows=2;t.placeholder='โน้ตของวันนี้...';t.value=notes[k]||'';t.oninput=()=>setNote(k,t.value);d.after(t)});
  $('#wall').insertAdjacentHTML('beforeend','<button class="btn g" id="da" style="width:100%;margin-top:16px">🗑 ลบประวัติทั้งหมด</button>');$('#da').onclick=e=>{if(!ask(e.currentTarget))return;ss.forEach(s=>del(s.id));renderWall()};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(ss.find(s=>s.id==b.dataset.p)));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(ask(b,'ลบคลิปนี้?')){del(+b.dataset.d);renderWall()}});
}
let calY=new Date().getFullYear(),calM=new Date().getMonth();
async function renderCal(){
  const ss=await all(),by={};
  ss.forEach(s=>{const k=key(s.id);by[k]=(by[k]||0)+s.dur});
  const th=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const yt=Object.keys(by).filter(k=>k.startsWith(calY+'-')).reduce((a,k)=>a+by[k],0);
  const hd=['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span class="h">${x}</span>`).join('');
  const today=key(Date.now());
  let h=`<div class="card row" style="align-items:center"><button class="btn g" id="py" style="flex:0 0 48px">◀</button><div style="flex:1;text-align:center"><b>${th[calM]} ${calY+543}</b><div class="mu">ยอดรวมปี ${calY+543}: ${mins(yt)}</div></div><button class="btn g" id="ny" style="flex:0 0 48px">▶</button></div>`;
  for(let m=calM;m<=calM;m++){
    const f=new Date(calY,m,1).getDay(),n=new Date(calY,m+1,0).getDate();
    let c='',mt=0;
    for(let i=0;i<f;i++)c+='<span class="e"></span>';
    for(let d=1;d<=n;d++){
      const k=calY+'-'+pad(m+1)+'-'+pad(d),sec=by[k]||0;mt+=sec;
      const a=sec?Math.min(1,.25+sec/60/90):0;
      c+=`<span data-k="${k}" class="${k===today?'t':''}" style="${a?`background:rgba(224,101,58,${a});color:${a>.55?'#fff':'inherit'}`:''}">${d}${notes[k]?'<small>✎</small>':''}${sec?`<small>${Math.round(sec/60)}น.</small>`:''}</span>`;
    }
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><b>ยอดรวมเดือน${th[m]}</b><span class="mu">${mt?mins(mt):'-'}</span></div><div class="cg">${hd}${c}</div></div>`;
  }
  $('#cal').innerHTML=h;document.querySelectorAll('#cal [data-k]').forEach(s=>s.onclick=()=>openNote(s.dataset.k));
  $('#py').onclick=()=>{if(--calM<0){calM=11;calY--}renderCal()};
  $('#ny').onclick=()=>{if(++calM>11){calM=0;calY++}renderCal()};
}
let pt,cur;
$('#dp').onclick=e=>{if(!ask(e.currentTarget))return;clearInterval(pt);const i=+$('#sl').value;cur.frames.splice(i,1);if(!cur.frames.length){del(cur.id);$('#dlg').close();renderWall();return}put(cur);const j=Math.min(i,cur.frames.length-1);$('#sl').max=cur.frames.length-1;$('#sl').value=j;$('#pimg').src=cur.frames[j]};
function play(s){
  if(!s.frames.length)return alert('คลิปนี้ไม่มีภาพ (จับเวลาอย่างเดียว)');
  cur=s;$('#sl').max=s.frames.length-1;$('#dlg').showModal();run();
}
function run(){
  clearInterval(pt);let i=0;
  pt=setInterval(()=>{if(i>=cur.frames.length){clearInterval(pt);return}$('#pimg').src=cur.frames[i];$('#sl').value=i;i++},cur.frames.length<30?500:90);
}
$('#sl').oninput=e=>{clearInterval(pt);$('#pimg').src=cur.frames[e.target.value]};
$('#rp').onclick=run;
$('#cl').onclick=()=>{clearInterval(pt);$('#dlg').close();renderWall()};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['rec','stat','cal','wall'].forEach(t=>$('#'+t).classList.toggle('hide',t!==b.dataset.t));
  if(b.dataset.t==='stat')renderStats();if(b.dataset.t==='cal')renderCal();if(b.dataset.t==='wall')renderWall();

/* ===== v2: confirm, wall, viewer, save ===== */
let cfFn;
function confirmDel(msg,fn){cfFn=fn;$('#cft').textContent=msg;$('#cf').showModal()}
$('#cfy').onclick=()=>{$('#cf').close();const f=cfFn;cfFn=null;if(f)f()};
$('#cfn').onclick=()=>{cfFn=null;$('#cf').close()};
function toF(im,w,q){const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*(im.videoHeight||im.height)/(im.videoWidth||im.width));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q||.65)}
function fromImg(f){return new Promise(r=>{const im=new Image();im.onload=()=>{frames.push(toF(im,Math.min(1280,im.width),.82));URL.revokeObjectURL(im.src);pc();r()};im.onerror=()=>r();im.src=URL.createObjectURL(f)})}
async function renderWall(){
  const ss=(await all()).sort((a,b)=>b.id-a.id),w=$('#wall');
  if(!ss.length){w.innerHTML='<div class="card mu">ยังไม่มีรูปหรือคลิป</div>';return}
  const g={};ss.forEach(s=>(g[key(s.id)]=g[key(s.id)]||[]).push(s));
  w.innerHTML='<div class="mu">แตะที่รูปเพื่อดู เล่นไทม์แลปส์ และบันทึก</div>';
  Object.keys(g).forEach(k=>{
    const h=document.createElement('div');h.className='day';h.textContent=new Date(k+'T12:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})+' • '+mins(g[k].reduce((a,s)=>a+s.dur,0));
    const t=document.createElement('textarea');t.rows=2;t.placeholder='โน้ตของวันนี้...';t.value=notes[k]||'';t.oninput=()=>setNote(k,t.value);
    const p=document.createElement('div');p.className='pics';
    g[k].forEach(s=>{
      const n=s.frames.length,c=document.createElement('div');c.className='pol';
      const th=document.createElement(n?'img':'div');
      if(n)th.src=s.frames[Math.floor(n/2)];else{th.className='ph';th.textContent='📖'}
      th.style.cursor='pointer';th.onclick=()=>openView(s);
      const pp=document.createElement('p');
      pp.textContent=[s.book||'ไม่ระบุเล่ม',s.dur?mins(s.dur):'',n>1?'🎞 '+n+' ภาพ':(n?'📷 1 ภาพ':'')].filter(Boolean).join(' • ');
      const b=document.createElement('button');b.textContent='🗑';
      b.onclick=ev=>{ev.stopPropagation();confirmDel('ลบรายการนี้ใช่ไหม?',()=>{del(s.id);renderWall()})};
      c.append(th,pp,b);p.append(c)});
    w.append(h,t,p)});
  const da=document.createElement('button');da.className='btn g';da.style.cssText='width:100%;margin-top:16px';da.textContent='🗑 ลบประวัติทั้งหมด';
  da.onclick=()=>confirmDel('ลบรายการทั้งหมดใช่ไหม? กู้คืนไม่ได้',()=>{ss.forEach(s=>del(s.id));renderWall()});
  w.append(da);
}
let vs,vt,vpl=false,vi=0;
function vshow(){$('#vi').src=vs.frames[vi];$('#vs').value=vi;$('#vt').textContent=(vi+1)+' / '+vs.frames.length}
function vpause(){clearInterval(vt);vpl=false;$('#vp').textContent='▶'}
function vplay(){clearInterval(vt);vpl=true;$('#vp').textContent='⏸';vt=setInterval(()=>{if(vi>=vs.frames.length-1){vpause();return}vi++;vshow()},vs.frames.length<30?500:90)}
function vmode(){const m=vs.frames.length>1;$('#vs').style.display=m?'':'none';$('#vp').style.display=m?'':'none';$('#vdf').style.display=m?'':'none';$('#vsv').textContent=m?'💾 บันทึกคลิป':'💾 บันทึกรูป';$('#vs').max=vs.frames.length-1}
function openView(s){if(!s.frames.length)return;vs=s;vi=0;vmode();$('#vw').showModal();vshow();if(s.frames.length>1)vplay()}
$('#vp').onclick=()=>{if(vpl)vpause();else{if(vi>=vs.frames.length-1)vi=0;vplay()}};
$('#vs').oninput=e=>{vpause();vi=+e.target.value;vshow()};
$('#vc').onclick=()=>$('#vw').close();
$('#vw').onclose=()=>{clearInterval(vt);renderWall()};
$('#vd').onclick=()=>{vpause();confirmDel(vs.frames.length>1?'ลบทั้งคลิปนี้ใช่ไหม?':'ลบรูปนี้ใช่ไหม?',()=>{del(vs.id);$('#vw').close()})};
$('#vdf').onclick=()=>{vpause();confirmDel('ลบภาพที่ '+(vi+1)+' ออกจากคลิปนี้?',()=>{vs.frames.splice(vi,1);if(!vs.frames.length){del(vs.id);$('#vw').close();return}put(vs);vi=Math.min(vi,vs.frames.length-1);vmode();vshow()})};
function d2b(u){const a=atob(u.split(',')[1]),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return new Blob([n],{type:'image/jpeg'})}
async function makeVideo(fr){
  const imgs=(await Promise.all(fr.map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u})))).filter(Boolean);
  if(!imgs.length||!window.MediaRecorder)throw 0;
  const W=Math.round(imgs[0].width/2)*2,H=Math.round(imgs[0].height/2)*2,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mt)throw 0;
  const rec=new MediaRecorder(c.captureStream(15),{mimeType:mt,videoBitsPerSecond:2e6}),ch=[];
  rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  const done=new Promise(r=>{rec.onstop=r}),per=imgs.length<30?500:66;
  rec.start();
  for(const i of imgs){x.fillStyle='#000';x.fillRect(0,0,W,H);const s=Math.min(W/i.width,H/i.height);x.drawImage(i,(W-i.width*s)/2,(H-i.height*s)/2,i.width*s,i.height*s);await new Promise(r=>setTimeout(r,per))}
  await new Promise(r=>setTimeout(r,per));rec.stop();await done;
  return{blob:new Blob(ch,{type:mt.split(';')[0]}),ext:mt.indexOf('mp4')>0?'mp4':'webm'};
}
$('#vsv').onclick=async()=>{
  const D=window.claude&&await window.claude.use('downloads');
  if(!D){$('#vt').textContent='บันทึกจากหน้านี้ไม่ได้ — ลองกดค้างที่รูปแล้วเลือกบันทึก';return}
  const btn=$('#vsv'),base='reading-'+key(vs.id);btn.disabled=true;
  try{
    if(vs.frames.length===1)await D.save({filename:base+'.jpg',data:d2b(vs.frames[0])});
    else{vpause();$('#vt').textContent='กำลังสร้างคลิป รอสักครู่...';const v=await makeVideo(vs.frames);await D.save({filename:base+'.'+v.ext,data:v.blob})}
    $('#vt').textContent='ส่งไปบันทึกแล้ว ✓';
  }catch(e){$('#vt').textContent=(e&&e.code==='declined')?'ยกเลิกการบันทึก':'บันทึกไม่สำเร็จ'}
  btn.disabled=false;
};
